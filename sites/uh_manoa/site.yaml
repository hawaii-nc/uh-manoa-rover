# UH Mānoa. The walkway graph is imported from OpenStreetMap:
#   campus-rover import-osm --site uh_manoa
# That needs network access to overpass-api.de and `pip install -e ".[osm]"`.
# The import writes graph.osm.yaml next to this file, using the same format
# as sites/demo_campus/graph.yaml.

name: uh_manoa
description: University of Hawaiʻi at Mānoa (MVP routes A and B).
crs: EPSG:32604          # UTM zone 4N, meters
origin: {lat: 21.2990, lon: -157.8170}

graph:
  source: file
  path: graph.osm.yaml
  # Network of surveyed walkways (campus-rover build-walknet); preferred when present.
  walk_path: cache/graph.walk.yaml
  osm:
    # Generous bounding box around campus (west, south, east, north).
    # Approximate. Tighten it after the first import.
    bbox: [-157.8240, 21.2925, -157.8100, 21.3040]

# Landmarks are matched by building name in the UH campus map's Buildings
# layer (layers.yaml); the walkway node nearest an accessible entrance, or else
# the footprint, is used. `osm_name` is the fallback when that layer isn't
# downloaded yet. Check the names against the UH campus map.
landmarks:
  holmes_hall: {building: Holmes Hall, osm_name: Holmes Hall, label: Holmes Hall}
  campus_center: {building: Campus Center, osm_name: Campus Center, label: Campus Center}
  architecture: {building: Architecture, osm_name: Architecture, label: School of Architecture}
  hamilton_library: {building: Hamilton Library, osm_name: Hamilton Library, label: Hamilton Library}

routes:
  A: {waypoints: [holmes_hall, campus_center], label: Holmes Hall -> Campus Center}
  B: {waypoints: [campus_center, architecture], label: Campus Center -> Architecture}
  AB: {waypoints: [holmes_hall, campus_center, architecture], label: Full trip A then B}

closures:
  # Construction near Hamilton Library. Once the UH "Active Constructions" layer
  # is downloaded (layers.yaml), it closes the exact areas and this can go.
  - {near_landmark: hamilton_library, radius_m: 80, reason: construction}

schedule: schedule.yaml

crowd:
  decay_m: 120
  density_per_person: 0.1
  # Placeholder head-counts. Estimate them from the public class schedule
  # (rooms x enrollment per time block), then calibrate with real counts.
  buildings:
    holmes_hall: {people_per_change: 300}
    campus_center: {people_per_change: 150}
    architecture: {people_per_change: 100}
  zones: {}               # e.g. tag McCarthy Mall edges with a zone after import

planner:
  speed_mps: 1.2
  max_slope: 0.083
  allow_stairs: false
  weights:
    distance: 1.0
    crowd: 0.05
    complexity: 0.3
    slope: 0.5

# 3D training world (campus-rover build-world). The corridor is the box around the
# route's landmark buildings plus `pad_m`. Lidar grids and road segments live in
# cache/ (not in git); docs/WORLD.md says how to fetch them.
world:
  landmarks: [holmes_hall, campus_center, architecture]
  pad_m: 150
  rasters: cache/rasters_corridor.npz
  segments: cache/raw/segments.json
  background_buildings: cache/raw/background_buildings.json
  # Official open data used for footprints, heights and checks (see docs/WORLD.md).
  open_data: cache/opendata
  # The lidar heights sit 21.8 m above Honolulu's 5 ft contours and the State's
  # 100 ft contours (measured at 3,837 contour points), so they are shifted to match.
  vertical_shift_m: -21.8
  # 2022-2023 NOAA/USGS Hawaiʻi lidar (public domain), the six 500 m tiles over the corridor.
  lidar_tiles:
    - https://noaa-nos-coastal-lidar-pds.s3.amazonaws.com/laz/geoid12b/10331/blk_2/20230127_4QFJ220550.copc.laz
    - https://noaa-nos-coastal-lidar-pds.s3.amazonaws.com/laz/geoid12b/10331/blk_2/20230127_4QFJ220555.copc.laz
    - https://noaa-nos-coastal-lidar-pds.s3.amazonaws.com/laz/geoid12b/10331/blk_2/20230309_4QFJ225550.copc.laz
    - https://noaa-nos-coastal-lidar-pds.s3.amazonaws.com/laz/geoid12b/10331/blk_2/20230127_4QFJ225555.copc.laz
    - https://noaa-nos-coastal-lidar-pds.s3.amazonaws.com/laz/geoid12b/10331/blk_2/20230309_4QFJ230550.copc.laz
    - https://noaa-nos-coastal-lidar-pds.s3.amazonaws.com/laz/geoid12b/10331/blk_2/20230218_4QFJ230555.copc.laz
  # Surveyed ground from UH's campus map: every paved area, lawn, curb, wall, ramp and
  # stair tread as a polygon. Keys are the layer's SURFACE_TYPE values.
  landcover:
    file: cache/opendata/uh_landcover.json
    field: SURFACE_TYPE
    paint_field: NOTES            # painted curbs: Red, Yellow, Green, Blue
    classes:
      Streets: road
      Hardscape asphalt: road
      Parking lots: road
      Walkways: walkway
      Hardscape cement: walkway
      Stepstones: stepstone       # stones set in lawn: not a continuous path
      Buildings: building_slab    # the slab under a building: not walkable network
      Ramp: ramp
      Stairs: stairs
      Curbs: curb
      Wall: wall
      Rock Wall: rock_wall
      Grass: grass
      Planter beds: planter
      Ivy: planter
      Gravel: gravel
      Rock: rock
      Dirt: dirt
      Pools/ fountains: water
      Lakes or ponds: water
      Canals or ditches: water
      Tennis courts - interior: sports_court
      Tennis courts - exterior: sports_court
  ground_lines:
    file: cache/opendata/uh_basemap_lines.json
    category_field: ESRI_CATEGORY
    categories: [ParkingLotLines, SportsFieldLines]
    colour_field: DESCRIPTION
  # Fences and gates (UH): drawn standing on the ground; heights are assumptions.
  fences:
    file: cache/opendata/uh_fences.json
    type_field: ESRI_TYPE
  # UH's surveyed accessible parking stalls, painted with the accessible symbol.
  accessible_stalls: cache/layers/accessible_parking.geojson
  # Paving read from UH photos (brick pavers at the Campus Center plaza).
  paving: paving.yaml
  # Crossings found by build-walknet; only marked or confirmed ones get zebra paint.
  crossings: cache/crossings.json
  # Street lights: UH's surveyed pole positions, drawn with a generic CC0 lamp model.
  light_poles:
    file: cache/opendata/uh_light_poles.json
    status_field: STATUS
    keep: [Active]
  # UH Planning's floor-plan PDFs, one per building number: used for floor counts only.
  floor_plans: https://manoa.hawaii.edu/planning/Public/PDF/{number}.pdf
