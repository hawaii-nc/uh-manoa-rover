# UH Mānoa class time blocks. These follow the usual pattern (MWF 50-minute
# classes on the half hour, TR 75-minute classes). Verify them against the
# current UH class schedule before calibrating.
blocks:
  - days: [Mon, Wed, Fri]
    starts: ["07:30", "08:30", "09:30", "10:30", "11:30", "12:30", "13:30", "14:30", "15:30", "16:30"]
    duration_min: 50
  - days: [Tue, Thu]
    starts: ["07:30", "09:00", "10:30", "12:00", "13:30", "15:00", "16:30"]
    duration_min: 75
