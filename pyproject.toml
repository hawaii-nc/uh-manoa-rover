[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campus-rover"
version = "0.1.0"
description = "Site-agnostic pipeline for a camera-only campus navigation rover (UH Mānoa first)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
osm = ["osmnx>=2.0"]
usd = ["usd-core>=25.5"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8", "usd-core>=25.5"]

[project.scripts]
campus-rover = "campus_rover.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/campus_rover"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
