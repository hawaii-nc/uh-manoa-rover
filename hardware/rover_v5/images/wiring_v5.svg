<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" font-family="DejaVu Sans, Arial, sans-serif"><rect width="2000" height="1200" fill="#ffffff"/><text x="30" y="40" font-size="26" font-weight="700">Campus Rover v5 wiring (RS00 rear drive, 48 V, Pi 5, cameras only)</text><rect x="30" y="70" width="230" height="120" rx="8" fill="#eef2f7" stroke="#34495e" stroke-width="2"/><text x="40" y="94" font-size="17" font-weight="700">Battery 48 V (13S)</text><text x="40" y="116" font-size="14" fill="#333">any 13S Li-ion, BMS common port</text><text x="40" y="135" font-size="14" fill="#333">54.6 V full, >= 15 A BMS</text><text x="40" y="154" font-size="14" fill="#333">XT60 out</text><rect x="310" y="70" width="170" height="95" rx="8" fill="#f7f9fb" stroke="#34495e" stroke-width="2"/><text x="320" y="94" font-size="17" font-weight="700">XT90-S main key</text><text x="320" y="116" font-size="14" fill="#333">anti-spark plug pair</text><text x="320" y="135" font-size="14" fill="#333">pull = everything off</text><rect x="530" y="70" width="170" height="95" rx="8" fill="#f7f9fb" stroke="#34495e" stroke-width="2"/><text x="540" y="94" font-size="17" font-weight="700">Main fuse 15 A</text><text x="540" y="116" font-size="14" fill="#333">58 V MINI blade</text><text x="540" y="135" font-size="14" fill="#333">(Littelfuse 0997)</text><rect x="750" y="60" width="230" height="110" rx="8" fill="#fdecea" stroke="#34495e" stroke-width="2"/><text x="760" y="84" font-size="17" font-weight="700">WAGO 221-415  W1</text><text x="760" y="106" font-size="14" fill="#333">+48 V ALWAYS ON</text><text x="760" y="125" font-size="14" fill="#333">after the main fuse</text><rect x="30" y="255" width="230" height="100" rx="8" fill="#f7f9fb" stroke="#34495e" stroke-width="2"/><text x="40" y="279" font-size="17" font-weight="700">Charge socket (rear)</text><text x="40" y="301" font-size="14" fill="#333">matches your charger plug</text><text x="40" y="320" font-size="14" fill="#333">in the old C14 cutout</text><text x="40" y="339" font-size="14" fill="#333">5 A 58 V fuse in the + lead</text><rect x="750" y="250" width="230" height="140" rx="8" fill="#fff4e5" stroke="#34495e" stroke-width="2"/><text x="760" y="274" font-size="17" font-weight="700">SSR  Crydom D1D12</text><text x="760" y="296" font-size="14" fill="#333">1 (+)  <- W1 +48 V</text><text x="760" y="315" font-size="14" fill="#333">2 (-)  -> W2 switched</text><text x="760" y="334" font-size="14" fill="#333">3 (+)  <- 5 V via E-stop NC-A</text><text x="760" y="353" font-size="14" fill="#333">4 (-)  -> GND (W3)</text><rect x="1060" y="250" width="250" height="105" rx="8" fill="#fff4e5" stroke="#34495e" stroke-width="2"/><text x="1070" y="274" font-size="17" font-weight="700">WAGO 221-415  W2</text><text x="1070" y="296" font-size="14" fill="#333">+48 V SWITCHED</text><text x="1070" y="315" font-size="14" fill="#333">dead while E-stop is pressed</text><rect x="1060" y="60" width="250" height="120" rx="8" fill="#f4ecf7" stroke="#34495e" stroke-width="2"/><text x="1070" y="84" font-size="17" font-weight="700">Pololu D42V55F5  (5 V)</text><text x="1070" y="106" font-size="14" fill="#333">IN  <- W1 via 3 A 58 V fuse</text><text x="1070" y="125" font-size="14" fill="#333">OUT 5 V -> Pi 5 pins 2+4,</text><text x="1070" y="144" font-size="14" fill="#333">74AHCT125 VCC, fan, E-stop A</text><rect x="1380" y="40" width="590" height="300" rx="8" fill="#eaf2fb" stroke="#34495e" stroke-width="2"/><text x="1390" y="64" font-size="17" font-weight="700">Raspberry Pi 5</text><text x="1390" y="86" font-size="14" fill="#333">pin 2, 4  5 V in      pin 6, 9, 14, 20  GND</text><text x="1390" y="105" font-size="14" fill="#333">pin 1  3.3 V -> PCA9685 VCC, BNO085 VIN</text><text x="1390" y="124" font-size="14" fill="#333">pin 3  SDA / pin 5  SCL -> PCA9685 + BNO085 (I2C1)</text><text x="1390" y="143" font-size="14" fill="#333">pin 11 GPIO17 <- E-stop NC-B (pressed / broken = 1)</text><text x="1390" y="162" font-size="14" fill="#333">pin 13 GPIO27 <- left bumper NC</text><text x="1390" y="181" font-size="14" fill="#333">pin 15 GPIO22 <- right bumper NC</text><text x="1390" y="200" font-size="14" fill="#333">USB3 (blue) x2 -> front stereo cams</text><text x="1390" y="219" font-size="14" fill="#333">USB2 -> left cam;  USB2 -> hub -> right cam + CANable</text><text x="1390" y="238" font-size="14" fill="#333">EEPROM: PSU_MAX_CURRENT=5000 (fed through GPIO 5 V)</text><text x="1390" y="257" font-size="14" fill="#333">can0 at 1 Mbit/s (gs_usb / SocketCAN)</text><rect x="30" y="430" width="300" height="130" rx="8" fill="#fdecea" stroke="#34495e" stroke-width="2"/><text x="40" y="454" font-size="17" font-weight="700">E-stop (hood, kept)</text><text x="40" y="476" font-size="14" fill="#333">NC-A: 5 V -> SSR 3 (+)</text><text x="40" y="495" font-size="14" fill="#333">NC-B: GPIO17 -> GND</text><text x="40" y="514" font-size="14" fill="#333">(add a 2nd NC contact block)</text><text x="40" y="533" font-size="14" fill="#333">pressed: motors + servos off</text><rect x="380" y="430" width="300" height="130" rx="8" fill="#f2f2f2" stroke="#34495e" stroke-width="2"/><text x="390" y="454" font-size="17" font-weight="700">WAGO 221-415  W3  GND</text><text x="390" y="476" font-size="14" fill="#333">battery -, SSR 4, 3 regulators,</text><text x="390" y="495" font-size="14" fill="#333">motor harness -, charge socket -</text><text x="390" y="514" font-size="14" fill="#333">(Pi GND comes via the 5 V reg)</text><rect x="1060" y="430" width="250" height="115" rx="8" fill="#fdf2f8" stroke="#34495e" stroke-width="2"/><text x="1070" y="454" font-size="17" font-weight="700">2x Pololu D42V55F7 (7.5 V)</text><text x="1070" y="476" font-size="14" fill="#333">IN <- W2 via 5 A 58 V fuse</text><text x="1070" y="495" font-size="14" fill="#333">OUT 7.5 V -> servo L, servo R</text><text x="1070" y="514" font-size="14" fill="#333">(one regulator per servo)</text><rect x="1380" y="430" width="280" height="130" rx="8" fill="#eef7ee" stroke="#34495e" stroke-width="2"/><text x="1390" y="454" font-size="17" font-weight="700">PCA9685 servo board</text><text x="1390" y="476" font-size="14" fill="#333">VCC 3.3 V (Pi pin 1), I2C 0x40</text><text x="1390" y="495" font-size="14" fill="#333">ch0 -> 74AHCT125 1A</text><text x="1390" y="514" font-size="14" fill="#333">ch1 -> 74AHCT125 2A</text><text x="1390" y="533" font-size="14" fill="#333">V+ terminal NOT used</text><rect x="1700" y="430" width="270" height="130" rx="8" fill="#eef7ee" stroke="#34495e" stroke-width="2"/><text x="1710" y="454" font-size="17" font-weight="700">74AHCT125 (kept)</text><text x="1710" y="476" font-size="14" fill="#333">VCC 5 V, 1OE + 2OE -> GND</text><text x="1710" y="495" font-size="14" fill="#333">1Y -> left servo signal</text><text x="1710" y="514" font-size="14" fill="#333">2Y -> right servo signal</text><rect x="1380" y="610" width="280" height="110" rx="8" fill="#fdf2f8" stroke="#34495e" stroke-width="2"/><text x="1390" y="634" font-size="17" font-weight="700">MKS HBL380 servos x2</text><text x="1390" y="656" font-size="14" fill="#333">power: its own 7.5 V regulator</text><text x="1390" y="675" font-size="14" fill="#333">signal: 74AHCT125 (5 V)</text><text x="1390" y="694" font-size="14" fill="#333">ground common with the Pi</text><rect x="1700" y="610" width="270" height="110" rx="8" fill="#eef7ee" stroke="#34495e" stroke-width="2"/><text x="1710" y="634" font-size="17" font-weight="700">BNO085 IMU (kept)</text><text x="1710" y="656" font-size="14" fill="#333">VIN 3.3 V, GND</text><text x="1710" y="675" font-size="14" fill="#333">SDA/SCL on I2C1 (0x4A)</text><rect x="30" y="760" width="320" height="130" rx="8" fill="#ececec" stroke="#34495e" stroke-width="2"/><text x="40" y="784" font-size="17" font-weight="700">RS00 right (CAN ID 2)</text><text x="40" y="806" font-size="14" fill="#333">XT30(2+2): +48 V, GND, CAN-H/L</text><text x="40" y="825" font-size="14" fill="#333">last node: 120 ohm across H-L</text><text x="40" y="844" font-size="14" fill="#333">CAN_TIMEOUT 4000 (0.2 s)</text><rect x="420" y="760" width="320" height="130" rx="8" fill="#ececec" stroke="#34495e" stroke-width="2"/><text x="430" y="784" font-size="17" font-weight="700">RS00 left  (CAN ID 1)</text><text x="430" y="806" font-size="14" fill="#333">XT30(2+2): +48 V, GND, CAN-H/L</text><text x="430" y="825" font-size="14" fill="#333">T-splice at the plug, stub <= 5 cm</text><text x="430" y="844" font-size="14" fill="#333">CAN_TIMEOUT 4000 (0.2 s)</text><rect x="820" y="760" width="300" height="130" rx="8" fill="#eaf2fb" stroke="#34495e" stroke-width="2"/><text x="830" y="784" font-size="17" font-weight="700">CANable 2.0 (USB-CAN)</text><text x="830" y="806" font-size="14" fill="#333">candleLight / gs_usb firmware</text><text x="830" y="825" font-size="14" fill="#333">termination jumper ON</text><text x="830" y="844" font-size="14" fill="#333">USB -> Pi (through the hub)</text><rect x="1380" y="790" width="280" height="95" rx="8" fill="#eef7ee" stroke="#34495e" stroke-width="2"/><text x="1390" y="814" font-size="17" font-weight="700">Bumper roller switches x2</text><text x="1390" y="836" font-size="14" fill="#333">NC to GND, other side to GPIO</text><text x="1390" y="855" font-size="14" fill="#333">pull-ups on in software</text><rect x="1700" y="790" width="270" height="95" rx="8" fill="#eaf2fb" stroke="#34495e" stroke-width="2"/><text x="1710" y="814" font-size="17" font-weight="700">Cameras x4 + USB hub (kept)</text><text x="1710" y="836" font-size="14" fill="#333">MJPEG 640 x 480, 30 fps</text><text x="1710" y="855" font-size="14" fill="#333">lock exposure + WB (v4l2-ctl)</text><path d="M 260,110 L 310,110" fill="none" stroke="#d62728" stroke-width="4" stroke-linejoin="round"/><text x="262" y="100" font-size="13" fill="#d62728" font-weight="600">14 AWG</text><path d="M 480,110 L 530,110" fill="none" stroke="#d62728" stroke-width="4" stroke-linejoin="round"/><path d="M 700,110 L 750,110" fill="none" stroke="#d62728" stroke-width="4" stroke-linejoin="round"/><text x="702" y="100" font-size="13" fill="#d62728" font-weight="600">14 AWG</text><path d="M 260,165 L 285,165 L 285,232 L 145,232 L 145,255" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round"/><text x="152" y="226" font-size="13" fill="#d62728" font-weight="600">charge lead: battery side of the key</text><path d="M 865,170 L 865,250" fill="none" stroke="#d62728" stroke-width="4" stroke-linejoin="round"/><text x="872" y="215" font-size="13" fill="#d62728" font-weight="600">14 AWG</text><path d="M 980,100 L 1060,100" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round"/><text x="985" y="90" font-size="13" fill="#d62728" font-weight="600">3 A fuse, 18 AWG</text><path d="M 980,300 L 1060,300" fill="none" stroke="#ff7f0e" stroke-width="4" stroke-linejoin="round"/><text x="990" y="290" font-size="13" fill="#ff7f0e" font-weight="600">14 AWG</text><path d="M 1185,355 L 1185,430" fill="none" stroke="#ff7f0e" stroke-width="3" stroke-linejoin="round"/><text x="1192" y="398" font-size="13" fill="#ff7f0e" font-weight="600">5 A fuse, 18 AWG</text><path d="M 1072,355 L 1072,405 L 1040,405 L 1040,700 L 600,700 L 600,760" fill="none" stroke="#ff7f0e" stroke-width="4" stroke-linejoin="round"/><text x="610" y="692" font-size="13" fill="#ff7f0e" font-weight="600">16 AWG to the motors (+48 V sw, GND, CAN in one cable, rear-left gland)</text><path d="M 60,190 L 15,190 L 15,600 L 530,600 L 530,560" fill="none" stroke="#111111" stroke-width="4" stroke-linejoin="round"/><text x="25" y="594" font-size="13" fill="#111111" font-weight="600">battery -, 14 AWG</text><path d="M 865,390 L 865,495 L 680,495" fill="none" stroke="#111111" stroke-width="2" stroke-linejoin="round"/><text x="690" y="488" font-size="13" fill="#111111" font-weight="600">SSR 4</text><path d="M 1060,525 L 1000,525 L 1000,535 L 680,535" fill="none" stroke="#111111" stroke-width="2" stroke-linejoin="round"/><text x="690" y="528" font-size="13" fill="#111111" font-weight="600">regulator GND</text><path d="M 460,560 L 460,760" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round"/><text x="468" y="740" font-size="13" fill="#111111" font-weight="600">harness GND</text><path d="M 1310,90 L 1380,90" fill="none" stroke="#8e44ad" stroke-width="4" stroke-linejoin="round"/><text x="1314" y="80" font-size="13" fill="#8e44ad" font-weight="600">5 V, 18 AWG</text><path d="M 1120,180 L 1120,215 L 720,215 L 720,415 L 300,415 L 300,430" fill="none" stroke="#8e44ad" stroke-width="3" stroke-linejoin="round"/><text x="520" y="427" font-size="13" fill="#8e44ad" font-weight="600">5 V -> E-stop NC-A</text><path d="M 250,430 L 250,400 L 735,400 L 735,330 L 750,330" fill="none" stroke="#8e44ad" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 5"/><text x="420" y="393" font-size="13" fill="#8e44ad" font-weight="600">NC-A -> SSR 3 (+)</text><path d="M 1310,160 L 1340,160 L 1340,410 L 1835,410 L 1835,430" fill="none" stroke="#8e44ad" stroke-width="2" stroke-linejoin="round"/><text x="1500" y="404" font-size="13" fill="#8e44ad" font-weight="600">5 V -> 74AHCT125 VCC</text><path d="M 1310,500 L 1345,500 L 1345,665 L 1380,665" fill="none" stroke="#e377c2" stroke-width="3" stroke-linejoin="round"/><text x="1300" y="600" font-size="13" fill="#e377c2" font-weight="600">7.5 V</text><path d="M 820,830 L 740,830" fill="none" stroke="#1f77b4" stroke-width="3" stroke-linejoin="round"/><text x="748" y="822" font-size="13" fill="#1f77b4" font-weight="600">CAN-H/L</text><path d="M 420,800 L 350,800" fill="none" stroke="#ff7f0e" stroke-width="3" stroke-linejoin="round"/><path d="M 420,820 L 350,820" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round"/><path d="M 420,840 L 350,840" fill="none" stroke="#1f77b4" stroke-width="3" stroke-linejoin="round"/><text x="40" y="915" font-size="13" fill="#555">left -> right motor: +48 V, GND, CAN-H/L under the floor, slack loop at each motor</text><path d="M 970,760 L 970,730 L 1352,730 L 1352,330 L 1380,330" fill="none" stroke="#7f7f7f" stroke-width="3" stroke-linejoin="round"/><text x="1180" y="724" font-size="13" fill="#7f7f7f" font-weight="600">USB (via hub)</text><path d="M 1835,790 L 1835,760 L 1950,760 L 1950,340" fill="none" stroke="#7f7f7f" stroke-width="3" stroke-linejoin="round"/><text x="1890" y="754" font-size="13" fill="#7f7f7f" font-weight="600">USB</text><path d="M 1520,340 L 1520,430" fill="none" stroke="#2ca02c" stroke-width="2" stroke-linejoin="round"/><text x="1527" y="390" font-size="13" fill="#2ca02c" font-weight="600">I2C</text><path d="M 1685,340 L 1685,665 L 1700,665" fill="none" stroke="#2ca02c" stroke-width="2" stroke-linejoin="round"/><text x="1660" y="600" font-size="13" fill="#2ca02c" font-weight="600">I2C</text><path d="M 1660,490 L 1700,490" fill="none" stroke="#2ca02c" stroke-width="2" stroke-linejoin="round"/><text x="1664" y="482" font-size="13" fill="#2ca02c" font-weight="600">PWM</text><path d="M 1760,560 L 1760,590 L 1560,590 L 1560,610" fill="none" stroke="#2ca02c" stroke-width="2" stroke-linejoin="round"/><text x="1580" y="583" font-size="13" fill="#2ca02c" font-weight="600">servo signals (5 V)</text><path d="M 330,530 L 360,530 L 360,575 L 1362,575 L 1362,300 L 1380,300" fill="none" stroke="#2ca02c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 5"/><text x="700" y="568" font-size="13" fill="#2ca02c" font-weight="600">NC-B -> GPIO17</text><path d="M 1380,840 L 1372,840 L 1372,345" fill="none" stroke="#2ca02c" stroke-width="2" stroke-linejoin="round"/><text x="1388" y="905" font-size="13" fill="#2ca02c">bumpers -> GPIO27 / GPIO22</text><text x="30" y="960" font-size="18" font-weight="700">Wire colours</text><line x1="30" y1="983" x2="80" y2="983" stroke="#d62728" stroke-width="5"/><text x="92" y="988" font-size="15">+48 V always on (battery, after key + main fuse)</text><line x1="30" y1="1009" x2="80" y2="1009" stroke="#ff7f0e" stroke-width="5"/><text x="92" y="1014" font-size="15">+48 V switched by the SSR (E-stop)</text><line x1="30" y1="1035" x2="80" y2="1035" stroke="#111111" stroke-width="5"/><text x="92" y="1040" font-size="15">ground (one star point: WAGO W3)</text><line x1="30" y1="1061" x2="80" y2="1061" stroke="#8e44ad" stroke-width="5"/><text x="92" y="1066" font-size="15">5 V</text><line x1="30" y1="1087" x2="80" y2="1087" stroke="#e377c2" stroke-width="5"/><text x="92" y="1092" font-size="15">7.5 V servo power</text><line x1="30" y1="1113" x2="80" y2="1113" stroke="#1f77b4" stroke-width="5"/><text x="92" y="1118" font-size="15">CAN bus 1 Mbit/s (twisted pair)</text><line x1="30" y1="1139" x2="80" y2="1139" stroke="#2ca02c" stroke-width="5"/><text x="92" y="1144" font-size="15">signals (I2C, PWM, switches)</text><line x1="30" y1="1165" x2="80" y2="1165" stroke="#7f7f7f" stroke-width="5"/><text x="92" y="1170" font-size="15">USB</text><text x="620" y="960" font-size="18" font-weight="700">Rules</text><text x="620" y="986" font-size="15" font-weight="400">1. Every part on the battery side is rated 60 V or more: 54.6 V full charge, RS00 trips at 60 V.</text><text x="620" y="1012" font-size="15" font-weight="400">2. Pull the XT90-S key before working inside. Press the E-stop before charging.</text><text x="620" y="1038" font-size="15" font-weight="400">3. One ground point (W3). The CAN, I2C and servo signals all share it.</text><text x="620" y="1064" font-size="15" font-weight="400">4. CAN: CANable end terminated (jumper ON), far end 120 ohm at the right motor plug. Stubs <= 5 cm.</text><text x="620" y="1090" font-size="15" font-weight="400">5. The SSR only cuts the motors and servos. The Pi stays on, sees the E-stop on GPIO17 and logs it.</text><text x="620" y="1116" font-size="15" font-weight="400">6. Set each RS00 once with RobStride's tool or SDK: CAN ID 1 (left), 2 (right), CAN_TIMEOUT 4000.</text><text x="620" y="1142" font-size="15" font-weight="400">7. Different battery? Any 7S-13S Li-ion with a common-port BMS works; speed scales with voltage.</text><text x="620" y="1168" font-size="15" font-weight="400">8. Different board? Keep its job (5 V for the Pi, 7.5 V servo power, SocketCAN adapter, 3.3 V I2C).</text></svg>